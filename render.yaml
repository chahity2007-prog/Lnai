# Render.com one-click deploy blueprint.
# Push to GitHub, then in Render: New + → Blueprint → select this repo.
services:
  - type: web
    name: resulink
    runtime: node
    plan: free
    branch: claude/linkedin-resume-cv-generator-p1hc4s
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
