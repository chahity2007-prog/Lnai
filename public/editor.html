<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a66c2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ResuLink" />
  <title>Editor — ResuLink</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="app-nav">
    <div class="brand"><span class="logo">in</span><strong>ResuLink</strong></div>
    <div class="app-actions">
      <span id="saveState" class="demo-note"></span>
      <label class="btn btn-outline" id="importZipBtn" title="Import a LinkedIn Data Export ZIP">
        <input type="file" id="importZipFile" accept=".zip,application/zip,application/x-zip-compressed" hidden />
        ↑ Import ZIP
      </label>
      <button class="btn btn-outline" id="logoutBtn">Sign out</button>
    </div>
  </nav>

  <div class="editor-wrap mode-edit" id="editorWrap">
    <!-- Mobile-only tab switcher -->
    <div class="mobile-tabs" id="mobileTabs">
      <button data-mode="edit" class="active">✎ Edit</button>
      <button data-mode="preview">👁 Preview</button>
    </div>
    <!-- Left: form -->
    <div class="editor" id="editor">
      <div class="section-card">
        <h3>Basic info</h3>
        <div class="field"><label>Full name</label><input data-bind="fullName" /></div>
        <div class="field"><label>Headline / title</label><input data-bind="headline" /></div>
        <div class="grid-2">
          <div class="field"><label>Email</label><input data-bind="email" /></div>
          <div class="field"><label>Phone</label><input data-bind="phone" /></div>
        </div>
        <div class="grid-2">
          <div class="field"><label>Location</label><input data-bind="location" /></div>
          <div class="field"><label>Website</label><input data-bind="website" /></div>
        </div>
        <div class="field"><label>LinkedIn URL</label><input data-bind="linkedin" /></div>
      </div>

      <div class="section-card">
        <h3>Professional summary</h3>
        <div class="field"><textarea data-bind="summary" rows="4"></textarea></div>
      </div>

      <div class="section-card">
        <h3>Experience</h3>
        <div id="experienceList"></div>
        <button class="add-btn" data-add="experience">+ Add experience</button>
      </div>

      <div class="section-card">
        <h3>Education</h3>
        <div id="educationList"></div>
        <button class="add-btn" data-add="education">+ Add education</button>
      </div>

      <div class="section-card">
        <h3>Skills</h3>
        <div class="tag-input" id="skillsInput">
          <input id="skillEntry" placeholder="Type a skill, press Enter" />
        </div>
      </div>

      <div class="section-card">
        <h3>Certifications</h3>
        <div id="certificationsList"></div>
        <button class="add-btn" data-add="certifications">+ Add certification</button>
      </div>

      <div class="section-card">
        <h3>Languages</h3>
        <div id="languagesList"></div>
        <button class="add-btn" data-add="languages">+ Add language</button>
      </div>
    </div>

    <!-- Right: live preview -->
    <div class="preview-pane">
      <div class="controls">
        <div class="seg" id="docType">
          <button data-doc="resume" class="active">Résumé</button>
          <button data-doc="cv">CV</button>
        </div>
        <select class="select" id="template">
          <option value="classic">Classic template</option>
          <option value="modern">Modern (sidebar)</option>
          <option value="minimal">Minimal</option>
        </select>
        <button class="btn btn-primary" id="downloadBtn">⬇ Download PDF</button>
      </div>
      <div class="doc-scale" id="printArea"></div>
    </div>
  </div>

  <script type="module" src="/js/render.js"></script>
  <script type="module" src="/js/editor.js"></script>
</body>
</html>
